; ============================================================================
;  badBOX — merged doomBOX (security tools) + flipBOX (game launcher)
;  PlatformIO Project Configuration File
; ============================================================================

[env:badBOX]
platform = espressif32
board = esp32dev
framework = arduino

; -z,muldefs is required by the doomBOX module set (nyanboxVersion is defined
; in two of its own translation units) — carried forward unchanged from the
; original doomBOX build so nothing there regresses.
;
; include/ is intentionally flat (not split into subfolders): PlatformIO
; auto-adds the project's include/ directory to every build AND to the
; VS Code IntelliSense config it generates, with no extra -I flags needed.
; An earlier version of this file split headers into include/doomBOX/,
; include/flipBOX/, include/badBOX/ and added custom -I flags for them —
; that compiled fine from the command line, but the PlatformIO VS Code
; extension's IntelliSense generator didn't pick up those custom -I paths,
; so cpptools couldn't find the headers and threw cascading false "not
; declared" errors. Flat include/ removes that failure mode entirely.
build_flags =
    -Wl,-z,muldefs

lib_deps =
    nrf24/RF24@^1.4.10
    olikraus/U8g2@^2.36.2
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.4.2
    miguelbalboa/MFRC522@^1.4.11

board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder