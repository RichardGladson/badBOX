; ============================================================================
;  Unified OS — flipBOX + doomBOX
;  Complete PlatformIO configuration for the combined firmware.
; ============================================================================
;  Layout expectation (adjust paths if your tree differs):
;
;    project/
;      platformio.ini          ← this file
;      include/                ← doomBOX headers (+ any shared)
;      src/
;        main.cpp              ← unified_main.cpp (ONLY main — do not also
;        …                     compile original flipBOX/doomBOX main.cpp)
;        <doomBOX modules>.cpp
;        <flipBOX games>.cpp   (f1, fast-and-furious, tokyo-drift, …)
;
;  If games or modules live in extra folders, extend build_src_filter or
;  use symlink/copy so PlatformIO compiles them once, with a single main.
; ============================================================================

[env:unified]
platform = espressif32
board = esp32dev
framework = arduino

; Large app partition required: doomBOX modules + flipBOX games + libs
; exceed the default ~1.2 MB application slot on many ESP32 boards.
board_build.partitions = huge_app.csv

; Allow multiple translation units to contribute the same weak/global
; symbols (needed by the original doomBOX multi-module layout).
build_flags =
    -Wl,-z,muldefs
    -DCORE_DEBUG_LEVEL=0

; Optional: uncomment if you hit include path issues with a non-flat tree
; build_flags =
;     -Wl,-z,muldefs
;     -Iinclude
;     -Isrc

lib_deps =
    olikraus/U8g2@^2.36.2
    nrf24/RF24@^1.4.10
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.4.2
    miguelbalboa/MFRC522@^1.4.11

; Prefer thorough dependency resolution (RF24 / U8g2 / MFRC522)
lib_ldf_mode = chain+

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload — raise if your cable/board supports it
upload_speed = 921600

; ---------------------------------------------------------------------------
; Source filter notes (uncomment/adapt if both original mains are still
; present in src/ and would collide):
;
; build_src_filter =
;     +<*>
;     -<main_flipbox_original.cpp>
;     -<main_doombox_original.cpp>
;
; Or keep only unified main.cpp named "main.cpp" and exclude other mains.
; ---------------------------------------------------------------------------

; Core libraries used but NOT listed in lib_deps (shipped with Arduino-ESP32):
;   Preferences, EEPROM, WiFi, SPIFFS/FS, WebServer, DNSServer, SPI, Wire,
;   FreeRTOS, esp_wifi / esp_bt / esp_now / esp_gap_ble_api (IDF components)
